# =========================================================
# MinaTech IoT - Backend
# Configuracion de desarrollo local (base H2 en memoria).
# Para producir contra MySQL, comentar el bloque H2 y
# descomentar/ajustar el bloque MySQL de mas abajo.
# =========================================================

spring.application.name=minatech-iot-backend

server.port=8080

# --- Base de datos H2 (desarrollo / pruebas en NetBeans) ---
spring.datasource.url=jdbc:h2:mem:minatechdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Base de datos MySQL (referencia para despliegue posterior) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/minatech_iot?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# =========================================================
# Seguridad / JWT
# =========================================================
# Clave de firma HS256 (>= 256 bits). Esta es una clave de DESARROLLO.
# Antes de desplegar en un entorno real, reemplazarla por una clave
# secreta propia (por ejemplo generada con un gestor de secretos) y
# nunca subirla a un repositorio publico.
minatech.jwt.secret=MinaTechIoTClaveSecretaDeDesarrolloCambiarEnProduccion2026
# Duracion del token en milisegundos (24 horas).
minatech.jwt.expiration-ms=86400000

# =========================================================
# MQTT - Recepcion de telemetria simulada por Node-RED
# =========================================================
# Conexion al broker MQTT local (Mosquitto corriendo en tu propia laptop,
# instalado para pruebas del proyecto). Antes de iniciar el backend,
# asegurate de tener Mosquitto corriendo en su propia ventana de CMD:
#   mosquitto -c "C:\Users\Ideapad5\Documents\UTP\Desarrollo Web Integrado\Minatech\mosquitto-config\mosquitto_dev.conf" -v

# URL del broker: tcp://<host>:<puerto>. Como Mosquitto corre en la misma
# maquina que el backend, el host es "localhost" y el puerto el que
# configuramos en mosquitto_dev.conf (listener 1883).
minatech.mqtt.broker-url=tcp://localhost:1883

# Identificador de este cliente MQTT frente al broker (puede ser cualquier
# texto, con tal de que no se repita si hay otro cliente conectado con el
# mismo id al mismo tiempo).
minatech.mqtt.client-id=minatech-backend

# Topico al que el backend se suscribe para recibir la telemetria.
# Debe coincidir EXACTAMENTE con el topico donde Node-RED (o quien publique
# los datos) va a mandar los mensajes JSON.
minatech.mqtt.topic=minatech/telemetria

# Usuario/password del broker. Como en mosquitto_dev.conf pusimos
# "allow_anonymous true", el broker no pide credenciales, asi que ambos
# quedan vacios.
minatech.mqtt.username=
minatech.mqtt.password=