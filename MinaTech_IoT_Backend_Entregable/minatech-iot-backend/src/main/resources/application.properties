# =========================================================
# MinaTech IoT - Backend
# Configuracion de desarrollo local (base H2 en memoria).
# Para producir contra MySQL, comentar el bloque H2 y
# descomentar/ajustar el bloque MySQL de mas abajo.
# =========================================================

spring.application.name=minatech-iot-backend

server.port=8080

# --- Base de datos H2 (desarrollo / pruebas en NetBeans) ---
spring.datasource.url=jdbc:h2:mem:minatechdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Base de datos MySQL (referencia para despliegue posterior) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/minatech_iot?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# =========================================================
# Seguridad / JWT
# =========================================================
# Clave de firma HS256 (>= 256 bits). Esta es una clave de DESARROLLO.
# Antes de desplegar en un entorno real, reemplazarla por una clave
# secreta propia (por ejemplo generada con un gestor de secretos) y
# nunca subirla a un repositorio publico.
minatech.jwt.secret=MinaTechIoTClaveSecretaDeDesarrolloCambiarEnProduccion2026
# Duracion del token en milisegundos (24 horas).
minatech.jwt.expiration-ms=86400000

# =========================================================
# MQTT - Recepcion de telemetria simulada por Node-RED
# =========================================================
# Estas variables todavia NO estan definidas por el equipo (ver Project
# Charter, responsabilidad de Angel Di Maria - Arquitectura Edge/MQTT).
# Mientras el valor de "broker-url" sea el texto PENDIENTE_DEFINIR, el
# listener MQTT no intenta conectarse (ver TelemetriaMqttListener) y la
# aplicacion arranca normalmente para poder probar login/registro.
#
# Cuando el broker este disponible, reemplazar cada valor:
minatech.mqtt.broker-url=PENDIENTE_DEFINIR_URL_DEL_BROKER
# Ejemplo real: tcp://192.168.1.50:1883  o  ssl://broker.hivemq.cloud:8883
minatech.mqtt.client-id=minatech-backend
minatech.mqtt.topic=PENDIENTE_DEFINIR_TOPICO
# Ejemplo real: minatech/telemetria
minatech.mqtt.username=
minatech.mqtt.password=
# Si el broker no requiere usuario/clave, dejar ambos vacios.
